<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>漢字語源・意味フラッシュカード</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  *:focus-visible { outline: 2px solid #dc2626; outline-offset: 2px; }
  .card-wrap { perspective: 1200px; cursor: pointer; }
  .card-3d { transition: transform 0.6s cubic-bezier(0.4,0,0.2,1); transform-style: preserve-3d; position: relative; min-height: 320px; }
  .card-3d.flipped { transform: rotateY(180deg); }
  .face { backface-visibility: hidden; -webkit-backface-visibility: hidden; position: absolute; inset: 0; border-radius: 1rem; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem; }
  .face-back { transform: rotateY(180deg); }
  @keyframes bounceIn { 0%{transform:scale(0.6);opacity:0;} 70%{transform:scale(1.08);} 100%{transform:scale(1);opacity:1;} }
  .bounce-in { animation: bounceIn 0.4s ease; }
  .progress-ring { transition: stroke-dashoffset 0.5s ease; }
</style>
</head>
<body class="bg-gradient-to-br from-red-50 via-orange-50 to-yellow-50 min-h-screen p-4">

<div class="max-w-xl mx-auto">
  <header class="text-center py-5">
    <h1 class="text-3xl font-bold text-red-800">漢字語源・意味カード</h1>
    <p class="text-red-500 mt-1">JLPTレベル別 間隔反復学習</p>
  </header>

  <!-- Filter & Stats -->
  <div class="bg-white rounded-2xl shadow p-4 mb-4 flex flex-wrap gap-3 items-center">
    <div>
      <label class="text-xs font-semibold text-gray-500 block mb-1">JLPTレベル</label>
      <div class="flex gap-2" role="group" aria-label="JLPTレベル選択">
        <button onclick="setLevel('all')" id="btn-all" class="level-btn px-3 py-1.5 rounded-lg text-sm font-semibold bg-red-600 text-white transition">全て</button>
        <button onclick="setLevel('N5N4')" id="btn-N5N4" class="level-btn px-3 py-1.5 rounded-lg text-sm font-semibold bg-gray-100 text-gray-700 hover:bg-red-100 transition">N5-N4</button>
        <button onclick="setLevel('N3N2')" id="btn-N3N2" class="level-btn px-3 py-1.5 rounded-lg text-sm font-semibold bg-gray-100 text-gray-700 hover:bg-red-100 transition">N3-N2</button>
        <button onclick="setLevel('N1')" id="btn-N1" class="level-btn px-3 py-1.5 rounded-lg text-sm font-semibold bg-gray-100 text-gray-700 hover:bg-red-100 transition">N1</button>
      </div>
    </div>
    <button onclick="toggleShuffle()" id="btn-shuffle" class="ml-auto px-3 py-1.5 bg-orange-100 text-orange-700 rounded-lg text-sm font-semibold hover:bg-orange-200 transition">🔀 シャッフル</button>
  </div>

  <!-- Progress -->
  <div class="bg-white rounded-2xl shadow p-3 mb-4 flex gap-4 text-center text-sm">
    <div class="flex-1"><p class="text-xs text-gray-400">残り</p><p id="stat-remain" class="font-bold text-red-700">-</p></div>
    <div class="flex-1"><p class="text-xs text-gray-400">知ってた</p><p id="stat-known" class="font-bold text-green-600">-</p></div>
    <div class="flex-1"><p class="text-xs text-gray-400">曖昧</p><p id="stat-fuzzy" class="font-bold text-yellow-500">-</p></div>
    <div class="flex-1"><p class="text-xs text-gray-400">要復習</p><p id="stat-review" class="font-bold text-red-500">-</p></div>
  </div>

  <!-- Card -->
  <div id="card-wrap" class="card-wrap mb-4" onclick="flipCard()" tabindex="0" role="button" aria-label="カードをめくる" onkeydown="if(event.key==='Enter'||event.key===' ')flipCard()">
    <div id="card-3d" class="card-3d bg-white rounded-2xl shadow-2xl">
      <!-- Front -->
      <div class="face bg-gradient-to-br from-white to-red-50 rounded-2xl">
        <span id="level-badge" class="text-xs font-bold px-3 py-1 rounded-full mb-4 bg-red-100 text-red-700"></span>
        <p id="kanji-char" class="text-9xl font-bold text-red-800 mb-4 bounce-in" style="font-family: 'serif';"></p>
        <p class="text-xs text-gray-400 mt-4">タップしてめくる</p>
      </div>
      <!-- Back -->
      <div class="face face-back bg-gradient-to-br from-amber-50 to-orange-50 rounded-2xl text-left">
        <div class="w-full">
          <div class="flex gap-3 mb-3 flex-wrap">
            <span class="bg-blue-100 text-blue-700 text-xs font-bold px-2 py-1 rounded">音: <span id="onyomi"></span></span>
            <span class="bg-green-100 text-green-700 text-xs font-bold px-2 py-1 rounded">訓: <span id="kunyomi"></span></span>
          </div>
          <p class="font-bold text-gray-800 text-lg mb-1">意味: <span id="meaning"></span></p>
          <p class="text-xs text-orange-600 mb-3 leading-relaxed">語源: <span id="origin"></span></p>
          <div class="border-t border-gray-200 pt-3">
            <p class="text-sm text-gray-700 mb-1 leading-relaxed">📝 <span id="ex1"></span></p>
            <p class="text-sm text-gray-700 leading-relaxed">📝 <span id="ex2"></span></p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Self-rating (shown after flip) -->
  <div id="rating-buttons" class="hidden flex gap-2 mb-4">
    <button onclick="rate('known')" class="flex-1 bg-green-100 hover:bg-green-200 text-green-700 font-bold py-3 rounded-xl transition">✓ 知ってた</button>
    <button onclick="rate('fuzzy')" class="flex-1 bg-yellow-100 hover:bg-yellow-200 text-yellow-700 font-bold py-3 rounded-xl transition">△ 曖昧</button>
    <button onclick="rate('review')" class="flex-1 bg-red-100 hover:bg-red-200 text-red-700 font-bold py-3 rounded-xl transition">✗ 要復習</button>
  </div>

  <!-- Nav -->
  <div class="flex justify-between items-center text-sm text-gray-400 mb-4">
    <button onclick="prevCard()" class="px-4 py-2 bg-white rounded-lg shadow hover:bg-gray-50" aria-label="前の漢字">← 前</button>
    <span id="nav-progress" class="font-semibold text-gray-600"></span>
    <button onclick="nextCard()" class="px-4 py-2 bg-white rounded-lg shadow hover:bg-gray-50" aria-label="次の漢字">次 →</button>
  </div>

  <!-- Finished -->
  <div id="finish-panel" class="hidden bg-white rounded-2xl shadow p-8 text-center">
    <p class="text-5xl mb-3">🎌</p>
    <p class="text-2xl font-bold text-gray-700 mb-2">デッキ完走！</p>
    <div id="finish-stats" class="text-sm text-gray-500 mb-4"></div>
    <div class="flex gap-3 justify-center">
      <button onclick="restartAll()" class="bg-red-500 hover:bg-red-600 text-white px-5 py-2.5 rounded-xl font-semibold transition">最初から</button>
      <button onclick="restartReview()" class="bg-orange-400 hover:bg-orange-500 text-white px-5 py-2.5 rounded-xl font-semibold transition">要復習のみ再挑戦</button>
    </div>
  </div>
</div>

  {kanji:'稀',level:'N1',onyomi:'キ',kunyomi:'まれ',meaning:'稀少・まれ・稀有',origin:'禾（稲）が散らばって少ない形。少ない・まれの意。',ex1:'稀少（きしょう）価値がある',ex2:'稀有（けう）な才能'},
  {kanji:'漠',level:'N1',onyomi:'バク',kunyomi:'',meaning:'漠然・砂漠・広大',origin:'水（氵）＋莫（広い）。水が広く広がる砂漠の意。',ex1:'漠然（ばくぜん）とした不安',ex2:'砂漠（さばく）を旅する'},
  {kanji:'葛',level:'N1',onyomi:'カツ',kunyomi:'',meaning:'葛藤・葛',origin:'艸（草）＋曷（絡まる）。つる植物が絡まる葛の象形。',ex1:'葛藤（かっとう）を抱える',ex2:'葛（くず）粉で料理する'},
  {kanji:'憤',level:'N1',onyomi:'フン',kunyomi:'いきどおる',meaning:'憤怒・憤る・激しい怒り',origin:'心（忄）＋賁（激しい）。心が激しく高ぶる怒りの意。',ex1:'憤慨（ふんがい）する',ex2:'義憤（ぎふん）を感じる'},
  {kanji:'礎',level:'N1',onyomi:'ソ',kunyomi:'いしずえ',meaning:'基礎・礎石・基盤',origin:'石（石）＋楚（おおかみの植物）。建物を支える礎石の意。',ex1:'基礎（きそ）を固める',ex2:'礎石（そせき）を築く'},
  {kanji:'矛',level:'N1',onyomi:'ム',kunyomi:'ほこ',meaning:'矛盾・矛（武器）',origin:'長柄の刺突武器の象形。矛盾の語源となった武器。',ex1:'矛盾（むじゅん）を指摘する',ex2:'矛（ほこ）と盾（たて）'},
  {kanji:'紡',level:'N1',onyomi:'ボウ',kunyomi:'つむぐ',meaning:'紡ぐ・紡績',origin:'糸（糸）＋方（方向）。糸を方向性を持って紡ぐ意。',ex1:'言葉を紡ぐ（つむぐ）',ex2:'紡績（ぼうせき）工場'},
  {kanji:'跳',level:'N1',onyomi:'チョウ',kunyomi:'とぶ',meaning:'跳躍・跳ぶ',origin:'足（足）＋兆（予兆）。足が跳び上がる予兆=跳ぶ意。',ex1:'飛躍（ひやく）的に成長',ex2:'障害物を跳び越える'},
  {kanji:'醸',level:'N1',onyomi:'ジョウ',kunyomi:'かもす',meaning:'醸造・醸成・かもす',origin:'酉（酒つぼ）＋襄（満ちる）。酒つぼが満ちる=醸造の意。',ex1:'雰囲気を醸成（じょうせい）する',ex2:'ビールを醸造（じょうぞう）する'},
  {kanji:'漸',level:'N1',onyomi:'ゼン',kunyomi:'ようやく',meaning:'漸次・ようやく・徐々に',origin:'水（氵）＋斬（切る）。水が少しずつ進む意。',ex1:'漸次（ぜんじ）改善していく',ex2:'漸く（ようやく）完成した'},
  {kanji:'蓄',level:'N1',onyomi:'チク',kunyomi:'たくわえる',meaning:'蓄積・貯蓄・蓄える',origin:'艸（草）＋畜（家畜）。草を蓄えるように積み重ねる意。',ex1:'経験を蓄積（ちくせき）する',ex2:'貯蓄（ちょちく）を増やす'},
];

let deck = [...KANJI_DATA];
let currentIndex = 0;
let isFlipped = false;
let shuffleMode = false;
let ratings = JSON.parse(localStorage.getItem('kanji-ratings') || '{}');
let currentLevel = 'all';

function setLevel(level) {
  currentLevel = level;
  document.querySelectorAll('.level-btn').forEach(b => b.classList.replace('bg-red-600','bg-gray-100') || b.classList.replace('text-white','text-gray-700'));
  const btn = document.getElementById('btn-' + level);
  if (btn) { btn.classList.replace('bg-gray-100','bg-red-600'); btn.classList.replace('text-gray-700','text-white'); }
  buildDeck();
}

function buildDeck() {
  deck = KANJI_DATA.filter(k => currentLevel === 'all' || k.level.startsWith(currentLevel.replace('N5N4','N5').replace('N3N2','N3')));
  if (currentLevel === 'N5N4') deck = KANJI_DATA.filter(k => k.level === 'N5' || k.level === 'N4');
  if (currentLevel === 'N3N2') deck = KANJI_DATA.filter(k => k.level === 'N3' || k.level === 'N2');
  if (shuffleMode) for (let i = deck.length - 1; i > 0; i--) { const j = Math.floor(Math.random()*(i+1)); [deck[i],deck[j]]=[deck[j],deck[i]]; }
  currentIndex = 0;
  isFlipped = false;
  document.getElementById('card-3d').classList.remove('flipped');
  document.getElementById('rating-buttons').classList.add('hidden');
  document.getElementById('finish-panel').classList.add('hidden');
  document.getElementById('card-wrap').style.display = '';
  showCard();
}

function toggleShuffle() {
  shuffleMode = !shuffleMode;
  document.getElementById('btn-shuffle').className = shuffleMode
    ? 'ml-auto px-3 py-1.5 bg-orange-500 text-white rounded-lg text-sm font-semibold transition'
    : 'ml-auto px-3 py-1.5 bg-orange-100 text-orange-700 rounded-lg text-sm font-semibold hover:bg-orange-200 transition';
  buildDeck();
}

function showCard() {
  if (currentIndex >= deck.length) {
    document.getElementById('card-wrap').style.display = 'none';
    document.getElementById('rating-buttons').classList.add('hidden');
    const known = Object.values(ratings).filter(v=>v==='known').length;
    const fuzzy = Object.values(ratings).filter(v=>v==='fuzzy').length;
    const review = Object.values(ratings).filter(v=>v==='review').length;
    document.getElementById('finish-stats').innerHTML =
      `<p>知ってた: <strong class="text-green-600">${known}</strong> / 曖昧: <strong class="text-yellow-500">${fuzzy}</strong> / 要復習: <strong class="text-red-500">${review}</strong></p>`;
    document.getElementById('finish-panel').classList.remove('hidden');
    return;
  }
  const k = deck[currentIndex];
  isFlipped = false;
  document.getElementById('card-3d').classList.remove('flipped');
  document.getElementById('rating-buttons').classList.add('hidden');

  document.getElementById('level-badge').textContent = 'JLPT ' + k.level;
  document.getElementById('kanji-char').textContent = k.kanji;
  document.getElementById('onyomi').textContent = k.onyomi || '—';
  document.getElementById('kunyomi').textContent = k.kunyomi || '—';
  document.getElementById('meaning').textContent = k.meaning;
  document.getElementById('origin').textContent = k.origin;
  document.getElementById('ex1').textContent = k.ex1;
  document.getElementById('ex2').textContent = k.ex2;
  document.getElementById('nav-progress').textContent = `${currentIndex+1} / ${deck.length}`;
  updateStats();
}

function flipCard() {
  isFlipped = !isFlipped;
  document.getElementById('card-3d').classList.toggle('flipped', isFlipped);
  if (isFlipped) document.getElementById('rating-buttons').classList.remove('hidden');
}

function rate(result) {
  const k = deck[currentIndex];
  ratings[k.kanji] = result;
  localStorage.setItem('kanji-ratings', JSON.stringify(ratings));
  currentIndex++;
  showCard();
}

function prevCard() { if (currentIndex > 0) { currentIndex--; showCard(); } }
function nextCard() { currentIndex = Math.min(currentIndex + 1, deck.length); showCard(); }

function restartAll() {
  currentIndex = 0;
  document.getElementById('finish-panel').classList.add('hidden');
  document.getElementById('card-wrap').style.display = '';
  showCard();
}

function restartReview() {
  deck = deck.filter(k => ratings[k.kanji] === 'review' || ratings[k.kanji] === 'fuzzy' || !ratings[k.kanji]);
  currentIndex = 0;
  document.getElementById('finish-panel').classList.add('hidden');
  document.getElementById('card-wrap').style.display = '';
  showCard();
}

function updateStats() {
  const known = Object.values(ratings).filter(v=>v==='known').length;
  const fuzzy = Object.values(ratings).filter(v=>v==='fuzzy').length;
  const review = Object.values(ratings).filter(v=>v==='review').length;
  document.getElementById('stat-remain').textContent = (deck.length - currentIndex) + '字';
  document.getElementById('stat-known').textContent = known + '字';
  document.getElementById('stat-fuzzy').textContent = fuzzy + '字';
  document.getElementById('stat-review').textContent = review + '字';
}

buildDeck();
</script>
</body>
</html>
